name: CI/CD — PulzeTrend Capital

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # JOB 2: Build Verification
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  # ─────────────────────────────────────────────
  # JOB 3: Trigger Hostinger Auto-Deploy
  # Runs only on push to main branch
  # Hostinger detects the push and auto-redeploys
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Notify Hostinger Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Hostinger Webhook (if configured)
        # Add HOSTINGER_DEPLOY_WEBHOOK secret in GitHub if Hostinger provides a webhook URL
        # Go to: Hostinger → Git → Copy webhook URL → Add as GitHub secret
        if: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo "✅ Hostinger deploy webhook triggered!"

      - name: Deploy Info
        run: |
          echo "✅ Code passed lint & build checks!"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌐 Hostinger will auto-deploy if Auto-Deploy is enabled in dashboard"
