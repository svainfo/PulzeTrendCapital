name: CI/CD — PulzeTrend Capital

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # JOB 2: Build
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.ts
          retention-days: 3

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Dedicated Server (SSH)
  # Runs only on push to master/main branch
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "──────────────────────────────────"
            echo "🚀 Starting deployment..."
            echo "──────────────────────────────────"

            # Navigate to app directory
            cd /var/www/pulzetrend

            # Pull latest code from GitHub
            echo "📦 Pulling latest code..."
            git pull origin master

            # Install / update dependencies
            echo "📥 Installing dependencies..."
            npm ci --production=false

            # Build the Next.js app
            echo "🏗️ Building application..."
            NEXT_TELEMETRY_DISABLED=1 npm run build

            # Restart the app with PM2 (zero-downtime reload)
            echo "♻️ Reloading PM2 process..."
            pm2 reload pulzetrend --update-env

            echo "──────────────────────────────────"
            echo "✅ Deployment complete!"
            echo "──────────────────────────────────"

      - name: Notify success
        if: success()
        run: echo "✅ Deployed successfully to production server!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed. Check server logs."
