services:
  # ── Development ──────────────────────────────
  dev:
    build:
      context: .
      target: deps
    image: pulzetrend-dev
    container_name: pulzetrend-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    command: npm run dev
    restart: unless-stopped

  # ── Production ───────────────────────────────
  app:
    build:
      context: .
      target: runner
    image: pulzetrend-capital:latest
    container_name: pulzetrend-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    restart: unless-stopped
    profiles:
      - production
